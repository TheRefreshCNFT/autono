<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#5BA3F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="16" height="16" fill="url(#bg)" rx="2.4"/>
  
  <!-- Walrus face -->
  <g transform="translate(8, 8)">
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="4.48" ry="3.84" fill="white" opacity="0.9"/>
    
    <!-- Eyes -->
    <circle cx="-1.28" cy="-0.8" r="0.4" fill="#2C3E50"/>
    <circle cx="1.28" cy="-0.8" r="0.4" fill="#2C3E50"/>
    
    <!-- Nose -->
    <circle cx="0" cy="0.96" r="0.48" fill="#34495E"/>
    
    <!-- Tusks -->
    <rect x="-1.6" y="1.92" width="0.48" height="1.92" fill="white" opacity="0.95"/>
    <rect x="1.12" y="1.92" width="0.48" height="1.92" fill="white" opacity="0.95"/>
    
    <!-- Whisker dots -->
    <circle cx="-3.2" cy="0.64" r="0.24" fill="#34495E" opacity="0.7"/>
    <circle cx="-3.84" cy="0.32" r="0.192" fill="#34495E" opacity="0.7"/>
    <circle cx="3.2" cy="0.64" r="0.24" fill="#34495E" opacity="0.7"/>
    <circle cx="3.84" cy="0.32" r="0.192" fill="#34495E" opacity="0.7"/>
  </g>
</svg>