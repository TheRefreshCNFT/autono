<!DOCTYPE html>
<html>
<head>
  <title>SVG to PNG Converter - wAli Walrus</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 10px;
    }
    h1 { text-align: center; }
    .icons { display: flex; justify-content: space-around; flex-wrap: wrap; }
    .icon-container { 
      background: white;
      color: #333;
      padding: 20px; 
      margin: 20px; 
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    canvas { 
      border: 2px solid #4A90E2; 
      display: block; 
      margin: 10px auto;
      background: white;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    button { 
      padding: 12px 24px; 
      margin: 5px; 
      cursor: pointer;
      background: #4A90E2;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      font-weight: bold;
    }
    button:hover {
      background: #357ABD;
    }
    .status {
      text-align: center;
      margin: 20px;
      font-size: 18px;
    }
    .auto-download {
      background: #50E3C2;
      padding: 15px;
      border-radius: 5px;
      margin: 20px 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🦭 wAli Walrus Logo → PNG Icons</h1>
    <div class="status" id="status">Loading...</div>
    
    <div class="auto-download">
      <button onclick="downloadAll()" style="font-size: 16px; padding: 15px 30px;">
        📥 Download All Icons (Auto)
      </button>
    </div>
    
    <div class="icons">
      <div class="icon-container">
        <h3>16×16 (Toolbar)</h3>
        <canvas id="canvas-16" width="16" height="16"></canvas>
        <button onclick="download(16)">Download 16×16</button>
      </div>
      
      <div class="icon-container">
        <h3>48×48 (Extension)</h3>
        <canvas id="canvas-48" width="48" height="48"></canvas>
        <button onclick="download(48)">Download 48×48</button>
      </div>
      
      <div class="icon-container">
        <h3>128×128 (Store)</h3>
        <canvas id="canvas-128" width="128" height="128"></canvas>
        <button onclick="download(128)">Download 128×128</button>
      </div>
    </div>
  </div>
  
  <script>
    const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="wali-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wali-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#50E3C2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5A623;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#wali-gradient)" />
  
  <!-- Walrus body (simplified) -->
  <ellipse cx="100" cy="120" rx="60" ry="50" fill="#F8F9FA" opacity="0.95" />
  
  <!-- Walrus head -->
  <ellipse cx="100" cy="85" rx="45" ry="40" fill="#F8F9FA" opacity="0.95" />
  
  <!-- Eyes -->
  <circle cx="85" cy="80" r="6" fill="#24292E" />
  <circle cx="115" cy="80" r="6" fill="#24292E" />
  <circle cx="87" cy="78" r="2" fill="#FFFFFF" />
  <circle cx="117" cy="78" r="2" fill="#FFFFFF" />
  
  <!-- Nose -->
  <ellipse cx="100" cy="95" rx="8" ry="6" fill="#24292E" opacity="0.7" />
  
  <!-- Tusks -->
  <rect x="88" y="100" width="4" height="20" rx="2" fill="#FFFFEE" opacity="0.9" />
  <rect x="108" y="100" width="4" height="20" rx="2" fill="#FFFFEE" opacity="0.9" />
  
  <!-- Whiskers (left) -->
  <line x1="55" y1="90" x2="75" y2="88" stroke="#24292E" stroke-width="1.5" opacity="0.6" />
  <line x1="55" y1="95" x2="75" y2="95" stroke="#24292E" stroke-width="1.5" opacity="0.6" />
  <line x1="55" y1="100" x2="75" y2="102" stroke="#24292E" stroke-width="1.5" opacity="0.6" />
  
  <!-- Whiskers (right) -->
  <line x1="145" y1="90" x2="125" y2="88" stroke="#24292E" stroke-width="1.5" opacity="0.6" />
  <line x1="145" y1="95" x2="125" y2="95" stroke="#24292E" stroke-width="1.5" opacity="0.6" />
  <line x1="145" y1="100" x2="125" y2="102" stroke="#24292E" stroke-width="1.5" opacity="0.6" />
  
  <!-- Flippers -->
  <ellipse cx="60" cy="130" rx="15" ry="25" fill="#E1E4E8" opacity="0.8" transform="rotate(-20 60 130)" />
  <ellipse cx="140" cy="130" rx="15" ry="25" fill="#E1E4E8" opacity="0.8" transform="rotate(20 140 130)" />
  
  <!-- Crypto coin accent (holding a coin) -->
  <circle cx="100" cy="155" r="12" fill="url(#wali-accent)" opacity="0.9" />
  <text x="100" y="161" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">₿</text>
  
  <!-- Friendly smile -->
  <path d="M 85 92 Q 100 100 115 92" stroke="#24292E" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round" />
  
  <!-- Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#wali-gradient)" stroke-width="3" opacity="0.5" />
</svg>`;
    
    const sizes = [16, 48, 128];
    let renderedCount = 0;
    
    function renderSVG(size) {
      const canvas = document.getElementById('canvas-' + size);
      const ctx = canvas.getContext('2d');
      const img = new Image();
      const blob = new Blob([svgContent], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      
      img.onload = function() {
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);
        renderedCount++;
        updateStatus();
      };
      
      img.onerror = function() {
        console.error('Failed to load SVG for size:', size);
        URL.revokeObjectURL(url);
      };
      
      img.src = url;
    }
    
    function updateStatus() {
      const status = document.getElementById('status');
      if (renderedCount === sizes.length) {
        status.innerHTML = '✅ All icons rendered! Click download buttons or use "Download All" 🦭';
        status.style.color = '#50E3C2';
      } else {
        status.innerHTML = `Rendering icons... ${renderedCount}/${sizes.length}`;
      }
    }
    
    function download(size) {
      const canvas = document.getElementById('canvas-' + size);
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'icon-' + size + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        console.log('Downloaded icon-' + size + '.png');
      });
    }
    
    function downloadAll() {
      sizes.forEach((size, index) => {
        setTimeout(() => download(size), index * 500);
      });
      alert('Downloading all icons! Check your Downloads folder.');
    }
    
    // Render all sizes on load
    window.onload = function() {
      sizes.forEach(size => renderSVG(size));
    };
  </script>
</body>
</html>
